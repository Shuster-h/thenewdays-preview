<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% if page.title %}{{ page.title }} — {% endif %}The New Days</title>
<meta name="viewport" content="initial-scale=1">
<meta name="color-scheme" content="light dark">
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}The New Days">

<meta property="og:image" content="{{ '/images/hero.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

</main>
